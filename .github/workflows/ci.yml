name: CI

# 为什么有这个文件：本仓此前**没有任何 CI**（见 docs/plans/2026-09-13-typed-unit-dirs.md §1③），
# `scripts/verify-all.sh` 再全，也得靠人记得在提交前手动敲。结果就是「改名改了 ~1100 处，
# 却在 npm 包 README、官网 meta、CLI --help 里漏了 12 处旧术语」这类漂移能一路合进 main。
# 这里把本地那条链原样搬进 CI —— 不新增检查项，只保证它真的会被跑。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支来了新推送时取消上一轮（省额度，结论也只关心最新）
concurrency:
  group: ci-${{ github.ref }}
  # PR 上新 push 掐掉旧 run（省资源）；**main 上不掐** —— 每次合并都要留下一份完整的检查，
  # 否则连合两条时，先合的那次 run 会被后一次 push 取消，merge commit 上显示 `cancelled`，
  # 看上去像合失败（2026-09-20 实际造成过一次困惑：部署 job 显示 cancelled，代码其实没事）。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ⚠️ Node 版本覆盖的**规则**（这里写一次，四处 prose 不许各说各话 —— 由
  #    `tests/docs/stability.test.ts` 做**集合相等**对拍，改一处忘一处会红）：
  #      · `import-floor` 的 matrix 只覆盖 **`engines` 声明的下限**（它是「声明可执行」的那条）；
  #      · 其余 job 一律跟**当前 LTS** 走。
  #    ⇒ 覆盖集合 = matrix ∪ {主 job 版本}。2026-09-29 前主 job 停在 Node 22（上一个 LTS），
  #      而当时的 LTS 已经是 **24** —— 那句话是真的、但没人守（见那个守卫的头注）。
  #
  # ⚠️ 改 `import-floor` 的 matrix 前先看 README/CONTRIBUTING 的说明：**matrix 取值会进
  #    必需检查名**（分支保护里现在钉的是「导入下限（Node 18）」与「（Node 20）」），
  #    增删取值 = 改分支保护配置，否则新取值那条不是必需检查、旧取值那条永远等不到。
  # ⚠️ 本 job 的 name 是分支保护的**必需状态检查**（repos/.../branches/main/protection）。
  # 改名 = 保护里那条检查永远等不到 → PR 卡死。要改必须同时更新保护配置。
  verify:
    name: 全链验证（verify-all 8 步）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 全历史（默认 depth=1 是**浅克隆**）：`tests/docs/commit-refs.test.ts` 要判「文档引用的
      # 提交是否在主干祖先链上」—— 浅克隆下历史不可见，那条守卫会**空转**（它会因解析下限而红）。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 与本地**逐字同一条链**（脚本自己推仓库根，不依赖 cwd）：
      # typecheck → build → typecheck:types → typecheck:tests → build:cli → test → e2e → build:website
      # 脚本按每步的**显式退出码**判定，失败会打印该步尾部输出。
      - name: verify-all
        run: bash scripts/verify-all.sh

  # 静态检查单独一个 job：不跑测试、失败快、反馈早（几秒 vs 几分钟）
  lint:
    name: Lint + 格式（Biome）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # `biome ci` 在 CI 下只报告、不写盘（--write 是本地用的）。
      # `--error-on-warnings`：零告警闸门（此前是「没 error 就绿」，存量 93 warnings 照样过）。
      - name: biome ci
        run: npx biome ci . --error-on-warnings

  # 守住 package.json 的 engines 声明（>=18）—— 见 scripts/check-import-floor.mjs 的说明。
  # 为什么不在 verify 里加矩阵：matrix 会给 job name 加后缀、进而改掉分支保护依赖的
  # 检查名（PR 会被卡死），所以这里用**独立 job**覆盖最低支持版本。
  import-floor:
    name: 导入下限（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 验证包可导入 + SqliteTaskStore 行为
        run: node scripts/check-import-floor.mjs

  e2e-mcp:
    name: MCP 端到端（真第三方 server，缺失时回落夹具）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # runner 上默认没有 uvx ⇒ 脚本的「离线回落本地夹具」分支**必定被走到**。
      # 一举两得：
      #   ① 确定性覆盖整条 MCP 协议面（夹具 server 与真 server 同一套协议，纯 stdlib，不联网）；
      #   ② 正好当「回落不许再崩」的回归守卫 —— 此前 spawn `uvx` 不存在时抛未捕获 'error'
      #      事件把进程带崩、根本走不到回落（已修：scripts/e2e-mcp.ts 的 proc.on('error')）。
      # 想覆盖真第三方 server（`uvx mcp-server-time`）在本机跑即可，
      # 或给本 job 加 astral-sh/setup-uv —— 但那样就不再覆盖回落分支了。
      - name: e2e:mcp
        run: npm run e2e:mcp

  # MCP **反向**桥端到端（app 菜单暴露成 MCP server，stdio + StreamableHTTP 两传输都真跑，
  # 客户端是出厂连接器；trace 落盘逐条对账）。**离线零网络**，不需要 uv —— 与 e2e-mcp 不同，
  # 它没有任何「缺失时回落」的分支，CI 与本机跑的是同一条路。
  e2e-mcp-server:
    name: MCP 反向桥端到端（e2e:mcp:server）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 脚本直接 tsx 跑 src（夹具子进程也走 tsx），不需要构建产物；与 e2e-mcp 不同，
      # 它没有任何「缺失时回落」的分支，CI 与本机跑的是同一条路。
      - name: e2e:mcp:server
        run: npm run e2e:mcp:server

  # ── deploy 示例的镜像：**在 CI 里真构建一次** ────────────────────────────────────
  # 为什么要有它：`examples/deploy` 是定位里「交付可上线的服务」那一脚的参考实现，
  # 而它的 Dockerfile 此前**没有任何门禁构建过** —— 本机没有 docker、本地链跑不了它，
  # 于是「镜像到底建不建得起来」只活在文档的一条示例命令里
  # （`docker compose up --build`；`docker` 在仓库其余 CI 配置里出现 0 次）。
  # 本 job 把那一跳变成 CI 侧的一次真实构建（ubuntu runner 自带 docker）。
  #
  # ⚠️ **它不是必需状态检查，不要加进分支保护**：本机无法等价复现 ⇒ 它给的是
  #    「CI 侧构建证据」，不是「本地绿即绿」。首次运行就是它的验证；红了就是红的，
  #    不静默。豁免登记在 `tests/scripts/verify-all-wiring.test.ts` 的 `EXEMPT`（理由可执行）。
  docker-image:
    name: 构建 deploy 示例镜像（非必需检查）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 构建上下文 = **仓库根**（Dockerfile 头部说明：镜像里先从源码构建框架，
      # 所以 examples/deploy 的 `file:../..` 依赖才解析得到）
      - name: docker build
        run: docker build -f examples/deploy/Dockerfile -t agentia-deploy-example .

  # ── 发布：官网自动上线 ──────────────────────────────────────────────────────────
  # 为什么有这个 job：官网部署此前**纯手动**（`npm run deploy:website`，见根 package.json）。
  # 2026-09-13 实际翻车了一次：PR #16 合并进 main、CI 全绿、仓库「看起来完事了」，
  # 线上却还是旧版 —— 因为合并只跑检查，**不会**推 Cloudflare Pages。只要没人记得敲那条
  # 命令，改动就静静躺在仓库里。本 job 把「push 到 main → 上线」变成不可忘的动作。
  #
  # 为什么放在本文件、而不是另开 deploy.yml：**跨 workflow 用不了 `needs:`**。
  # 另开文件就只能靠 `workflow_run` 绕，且部署**无法等验证通过** —— 坏产物可能先上线。
  # 放同一文件才能 `needs: [verify, lint]`，保证线上永远是过了验证的那一版。
  #
  # ⚠️ 本 job **不是**必需状态检查，**不要**加进分支保护：它只在 main 上跑（PR 上 skip），
  #    加进去会让 PR 永远等一个不会跑的检查 → 卡死（同上面 `verify` 的坑）。
  #
  # 需要两个仓库 secret（Settings → Secrets and variables → Actions）：
  #   CLOUDFLARE_API_TOKEN   —— 权限：Account → Cloudflare Pages → Edit
  #   CLOUDFLARE_ACCOUNT_ID  —— Cloudflare 账号 ID
  # 缺 secret 时本 job **响亮失败**并给出修复指引，不静默跳过 ——
  # 「静默跳过」正是上面那类「以为部署了、其实没有」的病根。
  deploy-website:
    name: 部署官网（Cloudflare Pages）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, lint] # 只在验证通过后才发布（verify 里已经建好 dist，这里复查一遍）
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 先亮出「secret 没配」这个具体故障，而不是让 wrangler 抛一句难懂的认证错
      - name: 检查 secret 是否已配置
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$TOKEN" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$ACCOUNT" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 secret:$missing —— 到 Settings → Secrets and variables → Actions 添加（CLOUDFLARE_API_TOKEN 需 Account → Cloudflare Pages → Edit 权限），然后重跑本 job。"
            exit 1
          fi

      # 与本地**逐字同一条命令**：`npm run deploy:website`
      # （= npm run build:website && npx --yes wrangler@4.131.0 pages deploy packages/website/dist --project-name=agentia-web）
      # CI 与人工共用同一条链、同一个 wrangler 版本 —— 不另立第二套参数（那正是漂移的起点）。
      - name: 构建并部署（与本地同一条命令）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:website

      # GEO / agent 可读性回归观察（**只报告，不阻断**）。
      #
      # 为什么挂在部署**之后**：AFDocs（agentdocsspec.com 的配套打分器，23 项检查）打的是**线上**
      # 站点，不是产物 —— 它的价值正在于「别人怎么看这个站」，本地那套产物守卫
      # （scripts/check-website-agent-readiness.mjs，折在 verify-all 第 8 步）替代不了它。
      #
      # 为什么 continue-on-error：它会去抓**站外**链接（2026-09-21 实测 github.com 那条 fetch failed），
      # 网络噪声或对方限流不该把「官网已部署」判红。先观察几轮，确认哪些项稳定可控，再决定要不要
      # 对我们能控的项（http-status-codes / llms-txt-* / markdown-*）立分数下限。
      - name: Agent 可读性打分（只报告，不阻断）
        continue-on-error: true
        run: |
          SITE=https://agentia-web.pages.dev

          # ① 自证：**本次构建的产物里写着本次提交**。
          #    这是下面那条轮询判据的前置 —— 没有它，「等不到新版本」会被误读成「部署太慢」，
          #    而真因可能是构建期没拿到 GITHUB_SHA（或 robots.txt.ts 里那行被删了）。
          #    注：本步是 continue-on-error，所以 `exit 1` **不阻断**流水线，
          #    但会在 run 上留一条 error 标注（本步的失败不静默）。
          if [ -z "${GITHUB_SHA}" ]; then
            echo "::error::GITHUB_SHA 为空 —— 本步的新鲜度判据靠它定位「本次运行要部署的那个提交」"
            exit 1
          fi
          if ! grep -qF "build: ${GITHUB_SHA}" packages/website/dist/robots.txt; then
            echo "::error::本次构建产物 packages/website/dist/robots.txt 里没有 \`build: ${GITHUB_SHA}\` —— 构建期没拿到 GITHUB_SHA，或 packages/website/src/pages/robots.txt.ts 里那行被删了"
            exit 1
          fi

          # ② 等新部署真上线：Cloudflare Pages 的 production 别名有秒级传播延迟，
          #    不等就直接打分，打的是**上一版**，报告会指向已经修好的问题。
          #
          #    判据 = 「线上 robots.txt 里的 `# build: <sha>` == 本次运行的 $GITHUB_SHA」
          #    （那行由 packages/website/src/pages/robots.txt.ts 在构建期写入；
          #     两端的契约由 tests/scripts/verify-all-wiring.test.ts 双向核对。）
          #
          #    ⚠️ 2026-10-08 换掉过一版判据（旧版：「robots.txt 里出现 `Sitemap: ` 行」，
          #    注释写着「它是本轮新增的产物，只有新版才可能有」）。那条**腐烂**了 ——
          #    `Sitemap:` 行是 PR #119 加进去的、此后每一版都有 ⇒ 条件恒为真、从不等待。
          #    实测：第 1 次探测就报「已在线上」，而 AFDocs 同时读到**旧的 sitemap**，
          #    刷出两条假 FAIL（llms-txt-links-resolve / llms-txt-coverage）。
          #    ⇒ **判据不能是「某个只有新版才有的字面量」**（她会随版本变旧、然后恒真），
          #      必须是「本次运行自己的身份」—— 后者不可能腐烂。
          waited=0
          for i in $(seq 1 30); do
            if curl -sS --max-time 10 "$SITE/robots.txt" | grep -qF "build: ${GITHUB_SHA}"; then
              echo "新版已在线上（第 ${i} 次探测）"
              waited=1
              break
            fi
            echo "等待部署生效…（第 ${i} 次）"
            sleep 4
          done
          # 等不到**不阻断**（本步只报告），但必须在 UI 上留一条 warning：
          # 否则下面那份报告会静默地打在上一个版本上 —— 而那正是本步存在的意义。
          if [ "$waited" -ne 1 ]; then
            echo "::warning::等了 120s 仍未在线上看到提交 ${GITHUB_SHA}，下面的报告可能打的是上一版"
          fi

          # 版本钉死我们在 2026-09-21 实测过的那版：报告步骤不需要「永远最新」，
          # 但很怕它某天换了一版检查口径、在只报告的步骤里刷出一堆看不懂的噪声。
          npx --yes afdocs@0.20.0 check "$SITE" --format scorecard
